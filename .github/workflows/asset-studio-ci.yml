name: Growth OS CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: growth-os-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --silent

      - name: Run tests and capture output
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          echo "$?" > test.exit
          exit 0

      - name: Run production build and capture output
        shell: bash
        run: |
          set +e
          npm run build > build.log 2>&1
          echo "$?" > build.exit
          exit 0

      - name: Run local release smoke checks
        shell: bash
        run: |
          set +e
          export ADMIN_DEV_AUTH_ENABLED=false
          export ADMIN_AUTH_SECRET="$(node -e "process.stdout.write('x'.repeat(48))")"
          export ADMIN_OWNER_PASSWORD="$(node -e "process.stdout.write('y'.repeat(16))")"
          export NEXT_PUBLIC_SITE_URL=https://club-bahia.example
          npm start > server.log 2>&1 &
          echo "$!" > server.pid
          SMOKE_BASE_URL=http://127.0.0.1:3000 npm run smoke:release > smoke.log 2>&1
          echo "$?" > smoke.exit
          kill "$(cat server.pid)" 2>/dev/null || true
          exit 0

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-os-verification-logs
          path: |
            test.log
            build.log
            smoke.log
            server.log
            test.exit
            build.exit
            smoke.exit
          retention-days: 3

      - name: Report verification result
        shell: bash
        run: |
          echo "Test exit: $(cat test.exit)"
          echo "Build exit: $(cat build.exit)"
          echo "Smoke exit: $(cat smoke.exit)"
          if [ "$(cat test.exit)" != "0" ] || [ "$(cat build.exit)" != "0" ] || [ "$(cat smoke.exit)" != "0" ]; then
            echo "Verification failed. Download the uploaded logs for details."
            exit 1
          fi
