name: Asset Studio CI

on:
  push:
    branches:
      - codex/milestone-4a-asset-studio
  pull_request:
    branches:
      - codex/milestone-3e-review-optimization

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run production build
        run: npm run build
